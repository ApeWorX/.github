name: Publish to PyPI
description: >
  Build with uv and publish via Trusted Publishing (OIDC) using
  `uv publish --trusted-publishing always`.
  Use from a per-repo workflow so PyPI still sees that repo's publish.yaml
  as job_workflow_ref (cross-repo reusable workflows are not supported by
  PyPI Trusted Publishing today — see pypi/warehouse#11096).
  The caller job must grant `id-token: write` (and `contents: read`).
  pypa/gh-action-pypi-publish is NOT used: nested inside a composite action
  it resolves github.action_repository to this repo (actions/runner#2473)
  and tries to run a non-existent ghcr.io/ApeWorX/.github:main image.
  PEP 740 attestations: uv publish uploads but does not generate them, so
  the "Generate Attestations" step signs each wheel/sdist with the pinned
  pypi-attestations CLI (Sigstore, ambient GitHub OIDC token with audience
  "sigstore", same approach as pypa/gh-action-pypi-publish attestations.py)
  and writes <dist>.publish.attestation next to it; uv publish then pairs
  and uploads those automatically (keep its `dist/*` glob so they are
  included).
  Third-party actions below are pinned to full commit SHAs; consumer
  callers may keep uses: ApeWorX/.github/.github/actions/publish@main.

runs:
  using: composite
  steps:
    # actions/checkout@v5 → v5.1.0
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    # astral-sh/setup-uv@v7 → v7.6.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"

    - name: Build Package
      shell: bash
      run: uv build

    - name: Generate Attestations
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::No GitHub OIDC token available; the calling job needs 'permissions: id-token: write'."
          exit 1
        fi
        shopt -s nullglob
        dists=(dist/*.whl dist/*.tar.gz)
        if [ ${#dists[@]} -eq 0 ]; then
          echo "::error::No wheels or sdists found in dist/"
          exit 1
        fi
        uvx --from pypi-attestations==0.0.30 pypi-attestations sign "${dists[@]}"
        ls -l dist/

    - name: Publish Package
      shell: bash
      run: uv publish --trusted-publishing always dist/*
