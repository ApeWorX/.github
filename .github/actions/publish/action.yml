name: Publish to PyPI
description: >
  Build with uv and publish via Trusted Publishing (OIDC) using
  `uv publish --trusted-publishing always`.
  Use from a per-repo workflow so PyPI still sees that repo's publish.yaml
  as job_workflow_ref (cross-repo reusable workflows are not supported by
  PyPI Trusted Publishing today — see pypi/warehouse#11096).
  The caller job must grant `id-token: write` (and `contents: read`).
  pypa/gh-action-pypi-publish is NOT used: nested inside a composite action
  it resolves github.action_repository to this repo (actions/runner#2473)
  and tries to run a non-existent ghcr.io/ApeWorX/.github:main image.
  Note: uv publish does not generate PEP 740 attestations, so releases
  published through this action carry no PyPI attestations.
  Third-party actions below are pinned to full commit SHAs; consumer
  callers may keep uses: ApeWorX/.github/.github/actions/publish@main.

runs:
  using: composite
  steps:
    # actions/checkout@v5 → v5.1.0
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    # astral-sh/setup-uv@v7 → v7.6.0
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.13.6"

    - name: Build Package
      shell: bash
      run: uv build

    - name: Publish Package
      shell: bash
      run: uv publish --trusted-publishing always dist/*
